services:
  assistente:
    # CLI interattiva: fuori da `docker compose up`, si avvia con `docker compose run --rm assistente`
    profiles: ["cli"]
    build: .
    stdin_open: true
    tty: true
    env_file: .env
    environment:
      # Sovrascrive il valore dell'.env locale: dal container l'host è host.docker.internal
      LMSTUDIO_BASE_URL: http://host.docker.internal:1234/v1
      # Il database delle note sta nel volume montato sotto, non nell'immagine
      NOTE_DB: /app/dati/note.db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./dati:/app/dati

  agente:
    build: .
    command: ["python", "-m", "assistente", "--http"]
    env_file: .env
    environment:
      # Sovrascrive il valore dell'.env locale: dal container l'host è host.docker.internal
      LMSTUDIO_BASE_URL: http://host.docker.internal:1234/v1
      NOTE_DB: /app/dati/note.db
      # Dentro il container il servizio deve ascoltare su tutte le interfacce
      HTTP_HOST: 0.0.0.0
      # Porta fissa: mappatura, AGENTE_URL e controllo di salute la presumono (prevale sul .env)
      HTTP_PORTA: "8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./dati:/app/dati
    ports:
      # Pubblicata solo sull'host locale
      - "127.0.0.1:8000:8000"
    healthcheck:
      # Sano = il processo risponde (non interroga LM Studio né il database); la slim non ha curl
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/salute', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build: .
    command: ["python", "-m", "backend"]
    env_file: .env
    environment:
      # Sovrascrive il valore dell'.env locale: dal container il database è il servizio postgres
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AGENTE_URL: http://agente:8000
      # Dentro il container il servizio deve ascoltare su tutte le interfacce
      BACKEND_HOST: 0.0.0.0
      # Porta fissa: mappatura, BACKEND_URL e controllo di salute la presumono (prevale sul .env)
      BACKEND_PORTA: "8001"
    ports:
      # Pubblicata solo sull'host locale
      - "127.0.0.1:8001:8001"
    healthcheck:
      # Sano = il processo risponde (non interroga LM Studio né il database); la slim non ha curl
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/salute', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      agente:
        condition: service_healthy

  frontend:
    build: .
    command: ["python", "-m", "frontend"]
    env_file: .env
    environment:
      # Sovrascrive il valore dell'.env locale: dal container il back-end è il servizio backend
      BACKEND_URL: http://backend:8001
      # Dentro il container il servizio deve ascoltare su tutte le interfacce
      FRONTEND_HOST: 0.0.0.0
      # Porta fissa: mappatura e controllo di salute la presumono (prevale sul .env)
      FRONTEND_PORTA: "8002"
    ports:
      # Pubblicata solo sull'host locale
      - "127.0.0.1:8002:8002"
    healthcheck:
      # Sano = il processo risponde (non interroga LM Studio né il database); la slim non ha curl
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy

  postgres:
    image: postgres:18.7
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?definire POSTGRES_USER nel .env}
      POSTGRES_DB: ${POSTGRES_DB:?definire POSTGRES_DB nel .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?definire POSTGRES_PASSWORD nel .env}
    volumes:
      # L'immagine 18 tiene i dati in /var/lib/postgresql/18/docker: si monta la cartella superiore
      - pgdati:/var/lib/postgresql
    ports:
      # Pubblicata solo sull'host locale, per le prove dall'host; 5433 perché 5432 può essere di un PostgreSQL locale
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdati:
