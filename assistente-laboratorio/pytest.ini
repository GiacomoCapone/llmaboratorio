[pytest]
pythonpath = src
testpaths = tests
markers =
    reale: prove con LM Studio attivo (escluse di default)
    rete: prove con Open-Meteo vero, Internet attivo (escluse di default)
    postgres: prove con PostgreSQL attivo e DATABASE_URL (escluse di default)
addopts = -m "not reale and not rete and not postgres"
